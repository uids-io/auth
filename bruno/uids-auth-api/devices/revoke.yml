info:
  name: Revoke Device
  type: http
  seq: 3

http:
  method: POST
  url: "{{authBaseUrl}}/devices/revoke"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "device_id": "{{deviceId}}"
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Revokes a device for the current user. CSRF required when using session cookie on auth domain.
