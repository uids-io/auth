info:
  name: List Devices
  type: http
  seq: 2

http:
  method: GET
  url: "{{authBaseUrl}}/devices"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Lists devices for authenticated user. Requires Bearer access token or valid session cookie on auth domain.
