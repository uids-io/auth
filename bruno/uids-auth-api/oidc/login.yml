info:
  name: Login Page
  type: http
  seq: 4
  tags:
    - browser

http:
  method: GET
  url: "{{authBaseUrl}}/login?state={{pendingState}}"
  params:
    - name: state
      value: "{{pendingState}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const pending = bru.getEnvVar("pendingState");

        if (pending && String(pending).length > 0) {
          console.log("login pending_state:", pending);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5

docs: Hosted login HTML. Pass `pendingState` from **Authorize** `Location` (`/login?state=...`).
