info:
  name: OAuth Providers
  type: http
  seq: 2

http:
  method: GET
  url: "{{authBaseUrl}}/.well-known/oauth-providers"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body?.providers) {
          const enabled = res.body.providers
            .filter((p) => p.enabled)
            .map((p) => p.id)
            .join(",");
          bru.setEnvVar("enabledLoginProviders", enabled);
          console.log("enabled providers:", enabled);
        }

settings:
  encodeUrl: true

docs: |-
  Lists login methods for custom portal UI: `google`, `microsoft`, `email`.
  Sets `enabledLoginProviders` (comma-separated) on success.

  Social providers include `authorizedRedirectUris` and `idpConsole` (`google_cloud`,
  `microsoft_entra`) — copy those URIs into the matching developer console.

  Use before building portal buttons; optional on `/authorize` as `login_provider=google`.
