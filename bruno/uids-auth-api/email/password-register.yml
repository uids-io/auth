info:
  name: Password Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{authBaseUrl}}/email/password/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "securepassword123",
        "display_name": "Test User"
      }
  auth: inherit

settings:
  encodeUrl: true

docs: |-
  Creates user with email/password. Password minimum 8 characters.
