info:
  name: Password Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{authBaseUrl}}/email/password/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "securepassword123",
        "display_name": "Test User"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body?.user_id) {
          bru.setEnvVar("lastUserId", String(res.body.user_id));
        }

settings:
  encodeUrl: true

docs: |-
  Sets `lastUserId` on 201 success.
