info:
  name: Password Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{authBaseUrl}}/email/password/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Uids-Device-Id
      value: "{{deviceId}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "securepassword123",
        "client_id": "{{clientId}}",
        "pending_state": "{{pendingState}}",
        "device_id": "{{deviceId}}",
        "platform": "web"
      }
  auth: inherit

settings:
  encodeUrl: true
  followRedirects: false

docs: |-
  Email/password login. Sets session + CSRF cookies.

  With `pending_state` (from `/authorize`), responds with redirect to portal `redirect_uri?code=`.
  Without `pending_state`, returns `{ success, user_id }`.
