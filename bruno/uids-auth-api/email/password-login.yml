info:
  name: Password Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{authBaseUrl}}/email/password/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Uids-Device-Id
      value: "{{deviceId}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "securepassword123",
        "client_id": "{{clientId}}",
        "pending_state": "{{pendingState}}",
        "device_id": "{{deviceId}}",
        "platform": "web"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const getHeader = (res, name) => {
          const lower = name.toLowerCase();
          if (Array.isArray(res.headers)) {
            const h = res.headers.find(
              (x) => String(x.name || "").toLowerCase() === lower,
            );
            return h?.value;
          }
          return res.headers?.[name];
        };
        const setCookie = getHeader(res, "set-cookie");
        if (setCookie) {
          const lines = Array.isArray(setCookie) ? setCookie : [setCookie];
          for (const line of lines) {
            const csrf = String(line).match(/uids_csrf=([^;]+)/);
            if (csrf?.[1]) bru.setEnvVar("csrfToken", csrf[1]);
            const sess = String(line).match(/uids_auth_session=([^;]+)/);
            if (sess?.[1]) bru.setEnvVar("sessionCookie", sess[1]);
          }
        }
        const location = getHeader(res, "location");
        if (location) {
          try {
            const u = new URL(location);
            const code = u.searchParams.get("code");
            const state = u.searchParams.get("state");
            if (code) bru.setEnvVar("authorizationCode", code);
            if (state) bru.setEnvVar("oauthState", state);
          } catch (e) {
            console.log("password login redirect parse skipped", e?.message);
          }
        }
        if (res.body?.user_id) {
          bru.setEnvVar("lastUserId", String(res.body.user_id));
        }

settings:
  encodeUrl: true
  followRedirects: false

docs: |-
  With `pending_state`: sets `authorizationCode` + `oauthState` from redirect `Location`.
  Sets `csrfToken` / `sessionCookie` from Set-Cookie. JSON-only response sets `lastUserId`.
