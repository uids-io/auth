info:
  name: Password Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{authBaseUrl}}/email/password/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Uids-Device-Id
      value: "{{deviceId}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "securepassword123",
        "client_id": "{{clientId}}",
        "pending_state": "{{pendingState}}",
        "device_id": "{{deviceId}}",
        "platform": "web"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Keep redirect parsing in sync with uids-auth-api/_lib/env-scripts.js
        const getHeader = (res, name) => {
          const lower = name.toLowerCase();
          if (typeof res?.getHeader === "function") {
            const viaGetter = res.getHeader(lower) ?? res.getHeader(name);
            if (viaGetter) return viaGetter;
          }
          if (Array.isArray(res?.headers)) {
            const h = res.headers.find(
              (x) => String(x?.name || x?.key || "").toLowerCase() === lower,
            );
            const value = h?.value ?? h?.val;
            if (value !== undefined && value !== null) return value;
          }
          const headers = res?.headers;
          if (headers && typeof headers === "object" && !Array.isArray(headers)) {
            return headers[lower] ?? headers[name];
          }
          return undefined;
        };
        const parseQueryParam = (redirectLocation, key) => {
          if (!redirectLocation) return null;
          const match = String(redirectLocation).match(
            new RegExp(`[?&]${key}=([^&#]*)`),
          );
          if (!match?.[1]) return null;
          try {
            return decodeURIComponent(match[1].replace(/\+/g, " "));
          } catch {
            return match[1];
          }
        };
        const setCookie = getHeader(res, "set-cookie");
        if (setCookie) {
          const lines = Array.isArray(setCookie) ? setCookie : [setCookie];
          for (const line of lines) {
            const csrf = String(line).match(/uids_csrf=([^;]+)/);
            if (csrf?.[1]) bru.setEnvVar("csrfToken", csrf[1]);
            const sess = String(line).match(/uids_auth_session=([^;]+)/);
            if (sess?.[1]) bru.setEnvVar("sessionCookie", sess[1]);
          }
        }
        const redirectLocation =
          getHeader(res, "location") ??
          (res?.status >= 300 &&
          res?.status < 400 &&
          typeof res?.url === "string"
            ? res.url
            : undefined);
        if (redirectLocation) {
          const portalCallback =
            bru.getEnvVar("redirectUri") ||
            bru.getEnvVar("authBaseUrl") ||
            "http://localhost:3000";
          let code = null;
          let state = null;
          try {
            const parsed = new URL(redirectLocation, portalCallback);
            code = parsed.searchParams.get("code");
            state = parsed.searchParams.get("state");
          } catch {
            code = parseQueryParam(redirectLocation, "code");
            state = parseQueryParam(redirectLocation, "state");
          }
          if (!code) code = parseQueryParam(redirectLocation, "code");
          if (!state) state = parseQueryParam(redirectLocation, "state");
          if (code) bru.setEnvVar("authorizationCode", code);
          if (state) bru.setEnvVar("oauthState", state);
        }
        if (res.body?.user_id) {
          bru.setEnvVar("lastUserId", String(res.body.user_id));
        }

settings:
  encodeUrl: true
  followRedirects: false

docs: |-
  With `pending_state`: sets `authorizationCode` + `oauthState` from redirect `Location`.
  Sets `csrfToken` / `sessionCookie` from Set-Cookie. JSON-only response sets `lastUserId`.
