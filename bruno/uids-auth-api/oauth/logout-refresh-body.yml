info:
  name: Logout (refresh token body)
  type: http
  seq: 5

http:
  method: POST
  url: "{{authBaseUrl}}/logout"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300) {
          bru.setEnvVar("accessToken", "");
          bru.setEnvVar("refreshToken", "");
          bru.setEnvVar("authorizationCode", "");
          bru.setEnvVar("csrfToken", "");
          bru.setEnvVar("pendingState", "");
        }

settings:
  encodeUrl: true

docs: |-
  Clears token env vars on success.
