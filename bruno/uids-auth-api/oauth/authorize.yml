info:
  name: Authorize (PKCE)
  type: http
  seq: 1
  tags:
    - browser

http:
  method: GET
  url: "{{authBaseUrl}}/authorize?response_type=code&client_id={{clientId}}&redirect_uri={{redirectUri}}&scope=openid profile email&state={{oauthState}}&code_challenge={{codeChallenge}}&code_challenge_method=S256"
  params:
    - name: response_type
      value: code
      type: query
    - name: client_id
      value: "{{clientId}}"
      type: query
    - name: redirect_uri
      value: "{{redirectUri}}"
      type: query
    - name: scope
      value: openid profile email
      type: query
    - name: state
      value: "{{oauthState}}"
      type: query
    - name: code_challenge
      value: "{{codeChallenge}}"
      type: query
    - name: code_challenge_method
      value: S256
      type: query
    - name: device_id
      value: "{{deviceId}}"
      type: query
      disabled: true
    - name: platform
      value: web
      type: query
      disabled: true
    - name: login_provider
      value: google
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const existing = bru.getEnvVar("codeVerifier");

        if (!existing || String(existing).length === 0) {
          const crypto = require("node:crypto");
          const verifier = crypto.randomBytes(32).toString("base64url");
          const challenge = crypto
            .createHash("sha256")
            .update(verifier)
            .digest("base64url");
          
          bru.setEnvVar("codeVerifier", verifier);
          bru.setEnvVar("codeChallenge", challenge);
        }
    - type: after-response
      code: |-
        // Keep in sync with uids-auth-api/_lib/env-scripts.js
        const getHeader = (res, name) => {
          const lower = name.toLowerCase();
          if (typeof res?.getHeader === "function") {
            const viaGetter = res.getHeader(lower) ?? res.getHeader(name);
            if (viaGetter) return viaGetter;
          }
          if (Array.isArray(res?.headers)) {
            const h = res.headers.find(
              (x) => String(x?.name || x?.key || "").toLowerCase() === lower,
            );
            const value = h?.value ?? h?.val;
            if (value !== undefined && value !== null) return value;
          }
          const headers = res?.headers;
          if (headers && typeof headers === "object" && !Array.isArray(headers)) {
            return headers[lower] ?? headers[name];
          }
          return undefined;
        };

        const resolveRedirectLocation = (response) =>
          getHeader(response, "location") ??
          (response?.status >= 300 &&
          response?.status < 400 &&
          typeof response?.url === "string"
            ? response.url
            : undefined);

        const parseQueryParam = (redirectLocation, key) => {
          if (!redirectLocation) return null;
          const match = String(redirectLocation).match(
            new RegExp(`[?&]${key}=([^&#]*)`),
          );
          if (!match?.[1]) return null;
          try {
            return decodeURIComponent(match[1].replace(/\+/g, " "));
          } catch {
            return match[1];
          }
        };

        const parseOAuthRedirectLocation = (redirectLocation) => {
          if (!redirectLocation || typeof redirectLocation !== "string") return;

          const authBase =
            bru.getEnvVar("authBaseUrl") || "http://localhost:3000";
          const portalCallback = bru.getEnvVar("redirectUri") || authBase;

          let pathname = "";
          let code = null;
          let state = null;

          try {
            const parsed = new URL(redirectLocation, authBase);
            pathname = parsed.pathname || "";
            code = parsed.searchParams.get("code");
            state = parsed.searchParams.get("state");
          } catch {
            try {
              const parsed = new URL(redirectLocation, portalCallback);
              pathname = parsed.pathname || "";
              code = parsed.searchParams.get("code");
              state = parsed.searchParams.get("state");
            } catch {
              pathname =
                redirectLocation
                  .replace(/\?.*$/, "")
                  .replace(/^[^:]+:\/\/[^/]+/, "") || "";
              code = parseQueryParam(redirectLocation, "code");
              state = parseQueryParam(redirectLocation, "state");
            }
          }

          if (!code) code = parseQueryParam(redirectLocation, "code");
          if (!state) state = parseQueryParam(redirectLocation, "state");

          if (code) bru.setEnvVar("authorizationCode", code);

          if (state) {
            if (/\/login\/?$/i.test(pathname)) {
              bru.setEnvVar("pendingState", state);
            } else {
              bru.setEnvVar("oauthState", state);
            }
          }
        };

        const redirectLocation = resolveRedirectLocation(res);
        if (redirectLocation) parseOAuthRedirectLocation(redirectLocation);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5

docs: |-
  Starts OAuth authorization code flow. **Before-request** generates PKCE if `codeVerifier` is empty.
  **After-response** reads `Location`: `/login?state=` → `pendingState`; `redirect_uri?code=` → `authorizationCode`.

  Optional `login_provider=google|microsoft|email` skips hosted login chooser (see **OAuth Providers**).
